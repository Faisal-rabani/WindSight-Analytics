<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E1A" />
      <stop offset="50%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#112239" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="156" rx="20" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="2" />

  <!-- Logo Mark Icon Container -->
  <g transform="translate(48, 30)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#iconGrad)" filter="url(#glow)" opacity="0.3" />
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#iconGrad)" />
    
    <!-- Wind Turbines / Streamlines Icon -->
    <path d="M26 38 C36 38 42 32 42 26 C42 20 36 16 30 16 C24 16 20 20 20 24" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M22 50 C38 50 66 50 72 44 C76 40 76 34 70 30 C64 26 58 30 58 34" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M20 62 C34 62 50 62 60 62 C68 62 74 66 74 72 C74 78 68 82 62 82 C56 82 52 78 52 74" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M24 74 C30 74 38 74 44 74" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Title & Branding Text -->
  <g transform="translate(175, 45)">
    <!-- Badge -->
    <rect x="0" y="-12" width="190" height="22" rx="11" fill="#1E3A5F" />
    <circle cx="12" cy="-1" r="4" fill="#10B981" />
    <text x="24" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7" letter-spacing="1">ELEXON BMRS VERIFIED</text>

    <!-- Main Title -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Wind<tspan fill="#38BDF8">Sight</tspan> <tspan fill="#94A3B8" font-weight="400">Analytics</tspan>
    </text>

    <!-- Subtitle -->
    <text x="1" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
      UK Wind Power Forecast Intelligence <tspan fill="#38BDF8">|</tspan> Day-Ahead Procurement Desk (Jan 2026)
    </text>
  </g>

  <!-- Top Right Accents -->
  <g transform="translate(710, 30)">
    <circle cx="10" cy="10" r="3" fill="#38BDF8" opacity="0.6" />
    <circle cx="28" cy="10" r="3" fill="#2563EB" opacity="0.6" />
    <circle cx="46" cy="10" r="3" fill="#0D9488" opacity="0.6" />
  </g>
</svg>
